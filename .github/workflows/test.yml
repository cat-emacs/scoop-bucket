name: Scoop install tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod https://get.scoop.sh -OutFile "$env:RUNNER_TEMP/install-scoop.ps1"
          & "$env:RUNNER_TEMP/install-scoop.ps1" -RunAsAdmin
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Scoop setup failed" }
          "$env:USERPROFILE/scoop/shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned manifests and verify shims
        shell: pwsh
        run: |
          scoop bucket add java
          if ($LASTEXITCODE -ne 0) { throw "Java bucket failed" }
          foreach ($name in @('android-project', 'compose-preview')) {
            scoop install "$env:GITHUB_WORKSPACE/bucket/$name.json"
            if ($LASTEXITCODE -ne 0) { throw "Install failed: $name" }
            $jdk = if ($name -eq 'compose-preview') { 'temurin21-jdk' } else { 'temurin17-jdk' }
            $env:JAVA_HOME = (scoop prefix $jdk).Trim()
            if ($LASTEXITCODE -ne 0) { throw "JDK lookup failed: $jdk" }
            $result = & $name doctor --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $result.schemaVersion -ne 1 -or $result.status -ne 'ready') { throw "Doctor failed: $name" }
            $major = if ($name -eq 'compose-preview') { '21' } else { '17' }
            if (($result.javaVersion -split '\.')[0] -ne $major) { throw "Wrong JVM: $name $($result.javaVersion)" }
          }
